<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">PraxFlow workflow diagram</title>
  <desc id="desc">Goal flows to Workflow, Skills, and Evidence, with Evidence feeding back into Workflow and Protocols constraining decisions, scope, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="80" r="180" fill="#58a6ff" opacity="0.05"/>
  <circle cx="1140" cy="348" r="220" fill="#a371f7" opacity="0.04"/>

  <g transform="translate(88 92)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <path d="M156 64 H324" stroke="#30363d" stroke-width="3"/>
    <path d="M492 64 H660" stroke="#30363d" stroke-width="3"/>
    <path d="M828 64 H996" stroke="#30363d" stroke-width="3"/>

    <path d="M1012 108 C1012 196 908 220 798 220 H352 V150" fill="none" stroke="#3fb950" stroke-width="3" stroke-dasharray="8 8" opacity="0.9"/>

    <path d="M308 54 L324 64 L308 74 Z" fill="#58a6ff"/>
    <path d="M644 54 L660 64 L644 74 Z" fill="#a371f7"/>
    <path d="M980 54 L996 64 L980 74 Z" fill="#3fb950"/>
    <path d="M342 150 L352 132 L362 150 Z" fill="#3fb950" opacity="0.95"/>

    <g>
      <rect width="156" height="128" rx="20" fill="#161b22" stroke="#30363d"/>
      <text x="78" y="52" fill="#8b949e" font-size="16" text-anchor="middle">USER</text>
      <text x="78" y="84" fill="#f0f6fc" font-size="24" font-weight="700" text-anchor="middle">Goal</text>
    </g>

    <g transform="translate(336 0)">
      <rect width="156" height="128" rx="20" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.7"/>
      <text x="78" y="52" fill="#8b949e" font-size="16" text-anchor="middle">COGNITION</text>
      <text x="78" y="84" fill="#f0f6fc" font-size="24" font-weight="700" text-anchor="middle">Workflow</text>
    </g>

    <g transform="translate(672 0)">
      <rect width="156" height="128" rx="20" fill="#161b22" stroke="#a371f7" stroke-opacity="0.7"/>
      <text x="78" y="52" fill="#8b949e" font-size="16" text-anchor="middle">METHOD</text>
      <text x="78" y="84" fill="#f0f6fc" font-size="24" font-weight="700" text-anchor="middle">Skills</text>
    </g>

    <g transform="translate(1008 0)">
      <rect width="156" height="128" rx="20" fill="#161b22" stroke="#3fb950" stroke-opacity="0.7"/>
      <text x="78" y="52" fill="#8b949e" font-size="16" text-anchor="middle">REALITY</text>
      <text x="78" y="84" fill="#f0f6fc" font-size="24" font-weight="700" text-anchor="middle">Evidence</text>
    </g>

    <g transform="translate(428 158)">
      <rect width="408" height="56" rx="28" fill="#161b22" stroke="#30363d"/>
      <circle cx="32" cy="28" r="7" fill="#58a6ff"/>
      <text x="54" y="35" fill="#c9d1d9" font-size="17">Protocols constrain decisions · scope · verification</text>
    </g>
  </g>
</svg>
