<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">PraxFlow</title>
  <desc id="desc">Engineering workflows for reliable AI agents</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="32" fill="url(#bg)"/>
  <circle cx="1120" cy="94" r="230" fill="#58a6ff" opacity="0.05"/>
  <circle cx="1180" cy="590" r="300" fill="#a371f7" opacity="0.04"/>

  <g transform="translate(84 92)">
    <rect x="0" y="0" width="8" height="72" rx="4" fill="url(#accent)"/>
    <text x="30" y="57" fill="#f0f6fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="750" letter-spacing="-2">PraxFlow</text>
    <text x="2" y="117" fill="#c9d1d9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="500">Engineering workflows for reliable AI agents</text>
    <text x="2" y="157" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Composable · Evidence-first · Human-guided · Reality-verified</text>
  </g>

  <g transform="translate(92 328)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <path d="M140 56 H304" stroke="#30363d" stroke-width="3"/>
    <path d="M460 56 H624" stroke="#30363d" stroke-width="3"/>
    <path d="M780 56 H944" stroke="#30363d" stroke-width="3"/>
    <path d="M1030 112 C1030 180 960 202 850 202 H350 V130" fill="none" stroke="#3fb950" stroke-width="3" stroke-dasharray="8 8" opacity="0.85"/>
    <path d="M304 46 L320 56 L304 66 Z" fill="#58a6ff"/>
    <path d="M624 46 L640 56 L624 66 Z" fill="#a371f7"/>
    <path d="M944 46 L960 56 L944 66 Z" fill="#3fb950"/>
    <path d="M340 130 L350 112 L360 130 Z" fill="#3fb950" opacity="0.9"/>

    <g>
      <rect width="140" height="112" rx="18" fill="#161b22" stroke="#30363d"/>
      <text x="70" y="48" fill="#8b949e" font-size="15" text-anchor="middle">USER</text>
      <text x="70" y="77" fill="#f0f6fc" font-size="22" font-weight="650" text-anchor="middle">Goal</text>
    </g>
    <g transform="translate(320 0)">
      <rect width="140" height="112" rx="18" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.65"/>
      <text x="70" y="48" fill="#8b949e" font-size="15" text-anchor="middle">COGNITION</text>
      <text x="70" y="77" fill="#f0f6fc" font-size="22" font-weight="650" text-anchor="middle">Workflow</text>
    </g>
    <g transform="translate(640 0)">
      <rect width="140" height="112" rx="18" fill="#161b22" stroke="#a371f7" stroke-opacity="0.65"/>
      <text x="70" y="48" fill="#8b949e" font-size="15" text-anchor="middle">METHOD</text>
      <text x="70" y="77" fill="#f0f6fc" font-size="22" font-weight="650" text-anchor="middle">Skills</text>
    </g>
    <g transform="translate(960 0)">
      <rect width="140" height="112" rx="18" fill="#161b22" stroke="#3fb950" stroke-opacity="0.65"/>
      <text x="70" y="48" fill="#8b949e" font-size="15" text-anchor="middle">REALITY</text>
      <text x="70" y="77" fill="#f0f6fc" font-size="22" font-weight="650" text-anchor="middle">Evidence</text>
    </g>

    <g transform="translate(410 126)">
      <rect width="420" height="54" rx="27" fill="#161b22" stroke="#30363d"/>
      <circle cx="31" cy="27" r="7" fill="#58a6ff"/>
      <text x="52" y="34" fill="#c9d1d9" font-size="16">Protocols constrain decisions · scope · verification</text>
    </g>
  </g>

  <text x="1188" y="594" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="end">Agent Skills compatible</text>
</svg>
