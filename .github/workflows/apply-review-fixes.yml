name: Apply review fixes

on:
  push:
    paths:
      - .github/workflows/apply-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Banner: move the protocol pill away from the feedback path and raise footer contrast.
          replace_once(
              "assets/praxflow-banner.svg",
              '<g transform="translate(410 166)">',
              '<g transform="translate(410 126)">',
          )
          replace_once(
              "assets/praxflow-banner.svg",
              'fill="#484f58" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15"',
              'fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15"',
          )

          # README presentation + explicit runtime/distribution contracts.
          replace_once(
              "README.md",
              'alt="PraxFlow — engineering workflows for reliable AI agents" width="100%"',
              'alt="PraxFlow — engineering workflows for reliable AI agents" width="92%"',
          )
          replace_once(
              "README.md",
              "## Quick start\n\n```bash",
              "## Quick start\n\nRequires **Python 3.10 or newer**.\n\n```bash",
          )
          replace_once(
              "README.md",
              "Agent Skills are the **distribution format**. PraxFlow's Workflow/Skill distinction is conceptual; both can be packaged as standards-compatible `SKILL.md` directories.\n",
              "Agent Skills are the **distribution format**. PraxFlow's Workflow/Skill distinction is conceptual; both can be packaged as standards-compatible `SKILL.md` directories.\n\nThe top-level [`protocols/`](protocols/) files are canonical methodology references for maintainers, not standalone installable packages. Installable Workflows and Skills carry the operational protocol guidance they need in their own `SKILL.md`; changing a Protocol therefore requires updating the affected packages in the same change.\n",
          )
          replace_once(
              "README.md",
              "CI also runs the validator and an installer smoke test on every relevant push and pull request.\n\nFor normative Agent Skills validation, also use the Agent Skills reference validator (`skills-ref validate`).",
              "CI runs the PraxFlow structural validator on Python 3.10 and the latest stable Python, checks every package with the pinned Agent Skills reference validator, and exercises installer paths and failure modes across supported targets.\n\nFor local normative Agent Skills validation, you can also use the Agent Skills reference validator (`skills-ref validate`).",
          )

          replace_once(
              "README.zh-CN.md",
              'alt="PraxFlow — 面向可靠 AI Agent 的工程工作流" width="100%"',
              'alt="PraxFlow — 面向可靠 AI Agent 的工程工作流" width="92%"',
          )
          replace_once(
              "README.zh-CN.md",
              "## 快速开始\n\n```bash",
              "## 快速开始\n\n需要 **Python 3.10 或更高版本**。\n\n```bash",
          )
          replace_once(
              "README.zh-CN.md",
              "Agent Skills 是 PraxFlow 的**分发格式**。PraxFlow 对 Workflow / Skill 的区分属于方法论概念层；在实际分发时，两者都可以被包装成标准兼容的 `SKILL.md` 目录。\n",
              "Agent Skills 是 PraxFlow 的**分发格式**。PraxFlow 对 Workflow / Skill 的区分属于方法论概念层；在实际分发时，两者都可以被包装成标准兼容的 `SKILL.md` 目录。\n\n顶层 [`protocols/`](protocols/) 文件是维护者使用的规范性方法论参考，并不是独立安装的 Agent Skill package。可安装的 Workflow / Skill 会在自己的 `SKILL.md` 中携带运行时真正需要的 Protocol 行为，因此修改 Protocol 时必须在同一个变更中同步更新受影响的 packages。\n",
          )
          replace_once(
              "README.zh-CN.md",
              "CI 会在相关 push / pull request 中自动执行 validator 和 installer smoke test。\n\n如果需要严格按照 Agent Skills 规范进行验证，也建议使用官方参考 validator：`skills-ref validate`。",
              "CI 会在 Python 3.10 和最新稳定版 Python 上运行 PraxFlow structural validator，使用固定版本的 Agent Skills reference validator 检查全部 package，并覆盖受支持 target 的安装路径与主要失败模式。\n\n本地如需按 Agent Skills 规范进行验证，也可以使用 reference validator：`skills-ref validate`。",
          )

          replace_once(
              "adapters/README.md",
              "Client paths change over time; treat this file and `scripts/install.py` as compatibility code, not methodology.\n\n## Agent Skills format",
              "Client paths change over time; treat this file and `scripts/install.py` as compatibility code, not methodology.\n\n## Requirements\n\nThe installer and validator require **Python 3.10 or newer**.\n\n## Agent Skills format",
          )

          replace_once(
              "docs/concepts.md",
              "Core protocols:\n\n- **Evidence** — how claims are grounded and conflicts are surfaced.\n- **Decisions** — what the agent may resolve autonomously and what requires human judgment.\n- **Change Scope** — how to minimize collateral change without confusing minimal diff with correct causal repair.\n- **Verification** — how completion claims are supported by proportionate external evidence.\n- **Knowledge** — what should be persisted beyond ephemeral model context.\n",
              "Core protocols:\n\n- **Evidence** — how claims are grounded and conflicts are surfaced.\n- **Decisions** — what the agent may resolve autonomously and what requires human judgment.\n- **Change Scope** — how to minimize collateral change without confusing minimal diff with correct causal repair.\n- **Verification** — how completion claims are supported by proportionate external evidence.\n- **Knowledge** — what should be persisted beyond ephemeral model context.\n\nThe repository-level `protocols/*.md` files are the canonical methodology references for maintainers. They are intentionally not standalone Agent Skill packages and are not copied by the installer. Portable Workflow/Skill packages embed the operational subset they require, so a Protocol change is incomplete until the affected packages are updated in the same change.\n",
          )

          # Installer: guard canonical sources and stage replacement before deleting an installed copy.
          replace_once(
              "scripts/install.py",
              "import argparse\nimport shutil\nimport sys\nfrom pathlib import Path",
              "import argparse\nimport shutil\nimport sys\nimport tempfile\nfrom pathlib import Path",
          )
          replace_once(
              "scripts/install.py",
              "\ndef main() -> int:\n",
              '''\ndef replace_tree(source: Path, target: Path) -> None:\n    \"\"\"Stage a package copy before replacing an existing installation.\"\"\"\n    target.parent.mkdir(parents=True, exist_ok=True)\n    staging_root = Path(\n        tempfile.mkdtemp(prefix=f\".praxflow-{target.name}-\", dir=target.parent)\n    )\n    staged = staging_root / \"new\"\n    backup = staging_root / \"old\"\n    committed = False\n\n    try:\n        shutil.copytree(source, staged)\n        if target.exists():\n            target.rename(backup)\n        try:\n            staged.rename(target)\n            committed = True\n        except Exception:\n            if target.exists():\n                shutil.rmtree(target)\n            if backup.exists():\n                backup.rename(target)\n            raise\n\n        if backup.exists():\n            shutil.rmtree(backup)\n    finally:\n        if not committed and backup.exists() and not target.exists():\n            backup.rename(target)\n        shutil.rmtree(staging_root, ignore_errors=True)\n\n\ndef main() -> int:\n''',
          )
          replace_once(
              "scripts/install.py",
              "    output_dir = resolve_output_dir(args)\n    actions: list[tuple[Path, Path]] = []",
              '''    output_dir = resolve_output_dir(args)\n\n    canonical_roots = tuple(\n        (ROOT / root_name).resolve() for root_name in (\"workflows\", \"skills\", \"packs\")\n    )\n    if any(\n        output_dir == canonical_root or output_dir.is_relative_to(canonical_root)\n        for canonical_root in canonical_roots\n    ):\n        print(\n            \"Refusing to install into PraxFlow canonical source directories: \"\n            f\"{output_dir}\",\n            file=sys.stderr,\n        )\n        return 4\n\n    actions: list[tuple[Path, Path]] = []''',
          )
          replace_once(
              "scripts/install.py",
              "    output_dir.mkdir(parents=True, exist_ok=True)\n\n    for source, target in actions:\n        if target.exists():\n            shutil.rmtree(target)\n        shutil.copytree(source, target)\n",
              "    output_dir.mkdir(parents=True, exist_ok=True)\n\n    for source, target in actions:\n        replace_tree(source, target)\n",
          )

          # Stronger CI: runtime floor, upstream conformance, and installer behavior matrix.
          (ROOT / ".github/workflows/validate.yml").write_text(
              '''name: Validate PraxFlow\n\non:\n  push:\n  pull_request:\n\npermissions:\n  contents: read\n\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    strategy:\n      fail-fast: false\n      matrix:\n        python-version: [\"3.10\", \"3.x\"]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: ${{ matrix.python-version }}\n      - name: Validate PraxFlow package structure\n        run: python3 scripts/validate.py\n      - name: Compile Python tooling\n        run: python3 -m py_compile scripts/install.py scripts/validate.py\n      - name: Install pinned Agent Skills reference validator\n        if: matrix.python-version == '3.x'\n        run: >-\n          python3 -m pip install\n          \"skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref\"\n      - name: Validate Agent Skills specification conformance\n        if: matrix.python-version == '3.x'\n        shell: bash\n        run: |\n          set -euo pipefail\n          for package in workflows/* skills/* packs/*; do\n            skills-ref validate \"$package\"\n          done\n\n  installer-smoke:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.10\"\n      - name: Exercise supported installer targets and failure modes\n        shell: bash\n        run: |\n          set -euo pipefail\n          root=\"$RUNNER_TEMP/praxflow-installer\"\n          rm -rf \"$root\"\n          mkdir -p \"$root\"\n\n          python3 scripts/install.py --target codex --scope project --dest \"$root/codex\" --pack praxflow-embedded\n          test -f \"$root/codex/.agents/skills/develop-feature/SKILL.md\"\n          test -f \"$root/codex/.agents/skills/diagnose/SKILL.md\"\n          test -f \"$root/codex/.agents/skills/praxflow-embedded/SKILL.md\"\n\n          python3 scripts/install.py --target claude --scope project --dest \"$root/claude\"\n          test -f \"$root/claude/.claude/skills/trace/SKILL.md\"\n\n          python3 scripts/install.py --target trae --scope project --dest \"$root/trae\"\n          test -f \"$root/trae/.agents/skills/grill/SKILL.md\"\n\n          python3 scripts/install.py --target generic --output-dir \"$root/generic\" --package survey\n          test -f \"$root/generic/survey/SKILL.md\"\n\n          HOME=\"$root/home\" python3 scripts/install.py --target codex --scope user --package trace\n          test -f \"$root/home/.agents/skills/trace/SKILL.md\"\n\n          python3 scripts/install.py --target codex --scope project --dest \"$root/dry\" --package diagnose --dry-run\n          test ! -e \"$root/dry/.agents/skills/diagnose\"\n\n          python3 scripts/install.py --target generic --output-dir \"$root/collision\" --package survey\n          if python3 scripts/install.py --target generic --output-dir \"$root/collision\" --package survey; then\n            echo \"collision test unexpectedly succeeded\" >&2\n            exit 1\n          fi\n          printf 'modified\\n' > \"$root/collision/survey/local-note.txt\"\n          python3 scripts/install.py --target generic --output-dir \"$root/collision\" --package survey --force\n          test ! -e \"$root/collision/survey/local-note.txt\"\n\n          if python3 scripts/install.py --target generic --output-dir \"$root/unknown\" --package does-not-exist; then\n            echo \"unknown package test unexpectedly succeeded\" >&2\n            exit 1\n          fi\n\n          before=$(sha256sum workflows/develop-feature/SKILL.md)\n          if python3 scripts/install.py --target generic --output-dir \"$GITHUB_WORKSPACE/workflows\" --package develop-feature --force; then\n            echo \"canonical-source guard unexpectedly succeeded\" >&2\n            exit 1\n          fi\n          after=$(sha256sum workflows/develop-feature/SKILL.md)\n          test \"$before\" = \"$after\"\n''',
              encoding="utf-8",
          )

          # Record the hardening work and map the already-published personal address for tools that honor mailmap.
          replace_once(
              "CHANGELOG.md",
              "- `.editorconfig` and `.gitignore` repository hygiene files.\n",
              "- `.editorconfig` and `.gitignore` repository hygiene files.\n- CI coverage for the Python 3.10 runtime floor, pinned Agent Skills reference validation, and cross-target installer smoke tests.\n",
          )
          replace_once(
              "CHANGELOG.md",
              "- Separated qualitative case-study evidence from controlled eval claims to avoid retrospective metric invention.\n",
              "- Separated qualitative case-study evidence from controlled eval claims to avoid retrospective metric invention.\n- Clarified that repository-level Protocol documents are canonical maintainer references while portable packages embed their required operational guidance.\n- Reduced README hero repetition and corrected the banner feedback-loop/pill overlap.\n- Hardened forced installation by refusing canonical source directories and staging replacement copies before removing an existing installation.\n- Documented Python 3.10+ as the supported tooling runtime.\n",
          )
          (ROOT / ".mailmap").write_text(
              "hamburger-os <171057917+hamburger-os@users.noreply.github.com> <296570182@qq.com>\n",
              encoding="utf-8",
          )

          # The helper must not remain in the repository.
          (ROOT / ".github/workflows/apply-review-fixes.yml").unlink()
          PY

      - name: Validate modified repository
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate.py
          python3 -m py_compile scripts/install.py scripts/validate.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("assets/praxflow-banner.svg")
          PY
          git diff --check

      - name: Validate Agent Skills conformance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          for package in workflows/* skills/* packs/*; do
            skills-ref validate "$package"
          done

      - name: Exercise installer behavior
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/praxflow-installer"
          rm -rf "$root"
          mkdir -p "$root"
          python3 scripts/install.py --target codex --scope project --dest "$root/codex" --pack praxflow-embedded
          python3 scripts/install.py --target claude --scope project --dest "$root/claude"
          python3 scripts/install.py --target trae --scope project --dest "$root/trae"
          python3 scripts/install.py --target generic --output-dir "$root/generic" --package survey
          HOME="$root/home" python3 scripts/install.py --target codex --scope user --package trace
          test -f "$root/codex/.agents/skills/praxflow-embedded/SKILL.md"
          test -f "$root/claude/.claude/skills/trace/SKILL.md"
          test -f "$root/trae/.agents/skills/grill/SKILL.md"
          test -f "$root/generic/survey/SKILL.md"
          test -f "$root/home/.agents/skills/trace/SKILL.md"
          python3 scripts/install.py --target codex --scope project --dest "$root/dry" --package diagnose --dry-run
          test ! -e "$root/dry/.agents/skills/diagnose"
          python3 scripts/install.py --target generic --output-dir "$root/collision" --package survey
          if python3 scripts/install.py --target generic --output-dir "$root/collision" --package survey; then exit 1; fi
          printf 'modified\n' > "$root/collision/survey/local-note.txt"
          python3 scripts/install.py --target generic --output-dir "$root/collision" --package survey --force
          test ! -e "$root/collision/survey/local-note.txt"
          if python3 scripts/install.py --target generic --output-dir "$root/unknown" --package does-not-exist; then exit 1; fi
          before=$(sha256sum workflows/develop-feature/SKILL.md)
          if python3 scripts/install.py --target generic --output-dir "$GITHUB_WORKSPACE/workflows" --package develop-feature --force; then exit 1; fi
          after=$(sha256sum workflows/develop-feature/SKILL.md)
          test "$before" = "$after"

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address repository review findings"
          git push
