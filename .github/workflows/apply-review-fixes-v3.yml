name: Apply review fixes v3

on:
  push:
    paths:
      - .github/workflows/apply-review-fixes-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply already-validated patch program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path(".github/workflows/apply-review-fixes.yml")
          text = helper.read_text(encoding="utf-8")
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          program = textwrap.dedent(text[start:end])
          exec(compile(program, str(helper), "exec"), {"__name__": "__main__"})
          PY
          # Workflow files are committed separately through the GitHub connector.
          git restore .github/workflows
          python3 scripts/validate.py
          python3 -m py_compile scripts/install.py scripts/validate.py
          git diff --check
      - name: Commit non-workflow fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: address repository review findings"
          git push
